# =============================================================
# STRAIN GAUGE Z OFFSET CALIBRATION MACROS
# =============================================================
# Add these to your macro.cfg or printer.cfg.
# They wrap the strain_gauge_z_cal module commands so they
# appear as buttons in Fluidd/Mainsail.
#
# G28 and BED_MESH_CALIBRATE continue using CR Touch as always.
# These commands are INDEPENDENT from homing.

[gcode_macro CALIBRAR_Z_OFFSET]
description: Auto-calibrate Z offset using the strain gauge corner pad
gcode:
    STRAIN_GAUGE_CALIBRATE_Z

[gcode_macro LEER_SENSOR_CARGA]
description: Read current force from HX711 sensor (diagnostic)
gcode:
    STRAIN_GAUGE_READ

[gcode_macro TARE_SENSOR_CARGA]
description: Tare (zero) the HX711 sensor
gcode:
    STRAIN_GAUGE_TARE
