# This file contains pin mappings for the stock 2022 Creality Ender 3
# V3 SE. To use this config, during "make menuconfig" select the
# STM32F103 with a "28KiB bootloader" and serial (on USART1 PA10/PA9)
# communication.
# "Enable extra low-leverl configuration options" and "Disable SWD on startup"

# If you prefer a direct serial connection, in "make menuconfig"
# select "Enable extra low-level configuration options" and select
# serial (on USART3 PB11/PB10), which is broken out on the 10 pin IDC
# cable used for the LCD module as follows:
# 3: Tx, 4: Rx, 9: GND, 10: VCC

# Don`t forget "make"

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The firmware
# filename must end in ".bin" and must not match the last filename
# that was flashed.
[include timelapse.cfg]
[include fluidd.cfg]

[include macro.cfg]

[exclude_object]

[virtual_sdcard]
path: ~/printer_2_data/gcodes
on_error_gcode: CANCEL_PRINT

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 64
rotation_distance: 40 #нове значення rotation_distance = rotation_distance*фактичний розмір/очікуваний розмір xyz куба
endstop_pin: !PA5
position_endstop: -14
position_min: -14
position_max: 220
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 64
rotation_distance: 40 #нове значення rotation_distance = rotation_distance*фактичний розмір/очікуваний розмір xyz куба
endstop_pin: !PA6
position_endstop: -14
position_min: -14
position_max: 230
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 4
second_homing_speed: 1
homing_retract_dist: 2.0

[extruder]
max_extrude_only_distance: 100.0
pressure_advance: 0.101
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.67 #На філаменті ставимо мітку маркером на відстані 70 мм від екструдера, виконуємо команди "G91" та "G1 E50 F60", потім міряємо відстань до мітки, якщо рівно 20 мм - це перемога, якщо ні використовуємо формулу нового значення rotation_distance = поточне значення rotation_distance * (70 - ваша відстань до мітки)/50
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
#pid_Kp: 29.248
#pid_Ki: 1.652
#pid_Kd: 129.423
min_temp: 0
max_temp: 270

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_kp: 66.978
#pid_ki: 0.807
#pid_kd: 1388.948
min_temp: 0
max_temp: 115

[heater_fan hotend_fan]
pin: PC1
max_power: 1.0
shutdown_speed : 0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0
heater:extruder
heater_temp : 50
fan_speed : 1.0

[fan]
pin: PA0

[mcu]
serial: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2:1.0-port0#/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0 #ls /dev/serial/by-id/*
#serial: /dev/ttyUSB2
restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

[mpu9250]
i2c_mcu: rpi
i2c_bus: i2c.1

[resonance_tester]
accel_chip: mpu9250
probe_points:
    100, 100, 20  # an example

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 1900
#max_accel_to_decel: 3000
max_z_velocity: 50
square_corner_velocity: 5.0
max_z_accel: 500

[bltouch]
sensor_pin: ^PC14
control_pin: PC13
x_offset: -13.0
y_offset: -13.0
speed: 7
samples: 2
sample_retract_dist: 3.0
samples_tolerance: 0.05
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 123, 123   # CR Touch sobre el centro de la cama
speed: 100
z_hop: 10
z_hop_speed: 10

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 200, 200
probe_count: 12, 12
mesh_pps: 2, 2
fade_start: 1
fade_end: 10
fade_target: 0
algorithm: bicubic

# Strain Gauge Z Offset Calibration (HX711 at front-left corner pad)
# Uses the load cell sensor independently from bltouch for Z offset only
[strain_gauge_z_cal]
sensor_type: hx711
dout_pin: PC6
sclk_pin: PA4
sample_rate: 80
gain: A-128
pad_x: 0
pad_y: 5
z_start_height: 5.0
z_min_position: -2.0
force_threshold: 20.0
step_size: 0.05
speed: 1.0
retract_dist: 2.0
clearance_z: 10.0
travel_speed: 80.0
target_probe_section: bltouch
counts_per_gram: 124.52113
reference_tare_counts: 403946

[e3v3se_display]
language: 6
logging: False

[output_pin beeper]
pin: PB0


[tmc2209 stepper_x]
uart_pin: PB12
run_current: 0.60
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: false

[tmc2209 stepper_y]
uart_pin: PB13
run_current: 0.60
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: false

[tmc2209 stepper_z]
uart_pin: PB14
run_current: 0.8
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: false

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor Laptop]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[pause_resume]
recover_velocity: 25

[display_status]

[respond]

[save_variables]
filename: ~/printer_2_data/config/variables.cfg

[force_move]

[delayed_gcode DELAYED_PRINTER_OFF]
initial_duration = 0.
gcode =
  {% if printer.idle_timeout.state == "Idle" %}
    {% if printer["extruder"].temperature > 50 %}
      UPDATE_DELAYED_GCODE ID=DELAYED_PRINTER_OFF DURATION=60
    {% else %}
#      WLED_OFF STRIP=roof
      POWER_OFF_PRINTER
    {% endif %}
  {% else %}
    M118 Printer not idle, cancelled PRINTER_OFF.
  {% endif %}

[idle_timeout]
gcode:
  M84
  TURN_OFF_HEATERS
  UPDATE_DELAYED_GCODE ID=DELAYED_PRINTER_OFF DURATION=60


[input_shaper]
shaper_freq_x: 42.8
shaper_type_x:2hump_ei
shaper_freq_y: 43.0
shaper_type_y: 2hump_ei
[gcode_arcs]
resolution: 0.1

