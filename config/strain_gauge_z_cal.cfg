# Example configuration snippet for printer.cfg
# Add this section AFTER your existing [bltouch] block.
# Your [bltouch], [safe_z_home], and [bed_mesh] remain UNCHANGED.

# Strain Gauge Z Offset Calibration (HX711 at front-left corner pad)
# Uses the load cell sensor independently from bltouch for Z offset only
[strain_gauge_z_cal]
sensor_type: hx711
dout_pin: PC6
sclk_pin: PA4
sample_rate: 80
gain: A-128
pad_x: 0                         # X position of calibration pad (machine coords)
pad_y: 5                         # Y position of calibration pad (machine coords)
z_start_height: 5.0              # Z height to start descent from
z_min_position: -2.0             # Safety limit — abort if reached
force_threshold: 20.0            # Grams of force to detect contact
step_size: 0.05                  # mm per descent step
speed: 1.0                       # mm/s descent speed
retract_dist: 2.0                # mm to retract after contact
clearance_z: 10.0                # Safe Z height for travel moves
travel_speed: 80.0               # mm/s for XY travel
target_probe_section: bltouch    # Where to save the calculated z_offset
counts_per_gram: 124.52113       # HX711 calibration factor (adjust for your unit)
reference_tare_counts: 403946    # HX711 tare reference (adjust for your unit)
